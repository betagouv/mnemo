name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, erwan-laptop]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mnemo
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemo -d mnemo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mnemo:mnemo@localhost:5432/mnemo
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: docker compose --env-file .env.local.example config

  browser:
    runs-on: [self-hosted, erwan-laptop]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mnemo
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemo -d mnemo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mnemo:mnemo@localhost:5432/mnemo
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
      COMPOSE_PROJECT_NAME: mnemo-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MNEMO_MINIO_PORT: 19200
      MNEMO_MINIO_CONSOLE_PORT: 19201
      S3_ENDPOINT: http://localhost:19200
      S3_PUBLIC_ENDPOINT: http://localhost:19200
      S3_REGION: us-east-1
      S3_BUCKET: mnemo-files
      S3_ACCESS_KEY: mnemo
      S3_SECRET_KEY: mnemo-local-password
      MNEMO_BACKGROUND_JOBS: "1"
      MNEMO_LOCAL_COPC_BINARY: ${{ github.workspace }}/apps/processing-worker/dist/process-point-cloud-once.js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: docker compose --env-file .env.local.example up -d minio create-bucket
      - run: pnpm --filter @mnemo/web exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Clean up browser storage
        if: always()
        run: docker compose --env-file .env.local.example down --volumes
