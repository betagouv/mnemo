name: mnemo

services:
  architecture:
    image: ghcr.io/likec4/likec4:1.59.2
    profiles: [docs]
    init: true
    working_dir: /data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - likec4 build --output /tmp/mnemo-architecture && likec4 preview --output /tmp/mnemo-architecture --listen 0.0.0.0
    ports:
      - "127.0.0.1:${MNEMO_ARCHITECTURE_PORT:-3202}:62001"
    volumes:
      - ./docs/architecture:/data:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mnemo-web:0.1.0
    environment:
      MNEMO_AUTH_MODE: development
      MNEMO_DEPLOYMENT_ENV: local
      DATABASE_URL: postgresql://mnemo:mnemo@postgres:5432/mnemo
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT:?S3_DOCKER_ENDPOINT is required}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      IFC_SERVER_URL: http://ifc-lite-server:8080
      IFC_SERVER_API_TOKEN: ${IFC_SERVER_API_TOKEN:-mnemo-local-ifc-token}
      IFC_BROWSER_PROCESSING_MAX_BYTES: 0
      MNEMO_BACKGROUND_JOBS: "1"
      POINT_CLOUD_PROCESSING_MODE: ${POINT_CLOUD_PROCESSING_MODE:-local}
      SCALINGO_API_TOKEN: ${SCALINGO_API_TOKEN:-}
      SCALINGO_APP: ${SCALINGO_APP:-}
      SCALINGO_REGION: ${SCALINGO_REGION:-osc-secnum-fr1}
      SCALINGO_ONE_OFF_SIZE: ${SCALINGO_ONE_OFF_SIZE:-M}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.7-flash}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-http://localhost:3200}
      IFC_MCP_URL: http://ifc-mcp:8765
      IFC_MCP_TOKEN: ${IFC_MCP_TOKEN:-mnemo-local-ifc-mcp-token}
      IFC_MCP_CACHE_DIR: /app/ifc-mcp-models
      IFC_MCP_MODEL_DIR: /app/models
      IFC_MCP_MAX_SESSIONS: ${IFC_MCP_MAX_SESSIONS:-2}
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      ifc-lite-server:
        condition: service_healthy
      ifc-mcp:
        condition: service_healthy
    ports:
      - "${MNEMO_WEB_PORT:-3200}:3000"
    volumes:
      - ifc-mcp-models:/app/ifc-mcp-models
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  processing-worker:
    profiles: [oneoff]
    build:
      context: .
      dockerfile: apps/processing-worker/Dockerfile
    image: mnemo-processing-worker:0.1.0
    environment:
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT:?S3_DOCKER_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      UNTWINE_PATH: /opt/untwine/bin/untwine

  ifc-lite-server:
    build:
      context: .
      dockerfile: infrastructure/ifc-lite-server/Dockerfile
    image: mnemo-ifc-lite-server:2.0.0
    environment:
      PORT: 8080
      RUST_LOG: info
      MAX_FILE_SIZE_MB: 1024
      REQUEST_TIMEOUT_SECS: 900
      WORKER_THREADS: 4
      CACHE_DIR: /app/cache
      CACHE_MAX_AGE_DAYS: 7
      IFC_SERVER_API_TOKEN: ${IFC_SERVER_API_TOKEN:-mnemo-local-ifc-token}
      S3_ENDPOINT: ${S3_DOCKER_ENDPOINT:?S3_DOCKER_ENDPOINT is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3200,http://127.0.0.1:3100
    ports:
      - "${MNEMO_IFC_SERVER_PORT:-3301}:8080"
    volumes:
      - ifc-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  ifc-mcp-cache-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 1001:1001 /models && chmod 700 /models"]
    volumes:
      - ifc-mcp-models:/models

  ifc-mcp:
    build:
      context: .
      dockerfile: infrastructure/ifc-mcp/Dockerfile
      args:
        IFC_MCP_VERSION: 0.13.1
    image: mnemo-ifc-mcp:0.13.1
    environment:
      IFC_MCP_TOKEN: ${IFC_MCP_TOKEN:-mnemo-local-ifc-mcp-token}
    ports:
      - "127.0.0.1:${MNEMO_IFC_MCP_PORT:-8765}:8765"
    depends_on:
      ifc-mcp-cache-init:
        condition: service_completed_successfully
    volumes:
      - ifc-mcp-models:/app/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8765').then(() => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  database-migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    image: mnemo-database-migrate:0.1.0
    environment:
      DATABASE_URL: postgresql://mnemo:mnemo@postgres:5432/mnemo
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mnemo
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
    ports:
      - "${MNEMO_POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
      target: server
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: mnemo-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mnemo
      MINIO_ROOT_PASSWORD: mnemo-local-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3200,http://127.0.0.1:3100
    ports:
      - "${MNEMO_MINIO_PORT:-9200}:9000"
      - "${MNEMO_MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  create-bucket:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
      target: client
      args:
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    image: mnemo-minio-client:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 mnemo mnemo-local-password;
      mc mb --ignore-existing local/mnemo-files;
      '

volumes:
  postgres-data:
  minio-data:
  ifc-cache:
  ifc-mcp-models:
