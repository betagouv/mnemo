packages:
  - apps/*
  - packages/*

overrides:
  # Temporary footprint optimization, pinned to the published fork archive.
  "@ifc-lite/wasm": https://github.com/boehm-e/ifc-lite/releases/download/wasm-v10.4.0-mnemo.1/ifc-lite-wasm-10.4.0-mnemo.1.tgz
  "@typescript-eslint/typescript-estree>minimatch": 11.0.1
  esbuild: 0.28.2
  source-map-js: 1.2.2
  undici: 7.30.1
  vite: 8.2.4

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@parcel/watcher"
  - esbuild
  - prisma
# geometry 7.8.1 publishes geometry.worker.js but its pool still references .ts.
# Remove this patch when the upstream package fixes its published worker URL.
patchedDependencies:
  "@ifc-lite/geometry@7.8.1": patches/@ifc-lite__geometry@7.8.1.patch
